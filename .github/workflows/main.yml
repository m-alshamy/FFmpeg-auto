name: FFmpeg Dynamic HLS Test
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'رابط الفيديو المباشر (MP4)'
        required: true
        type: string
        default: 'https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/720/Big_Buck_Bunny_720_10s_1MB.mp4'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download Video from Dynamic URL
        run: wget "${{ github.event.inputs.video_url }}" -O input.mp4

      - name: Chunk Video to HLS
        run: ffmpeg -i input.mp4 -profile:v baseline -level 3.0 -start_number 0 -hls_time 4 -hls_list_size 0 -f hls index.m3u8

      - name: Verify Output Files
        run: ls -lh *.m3u8 *.ts
