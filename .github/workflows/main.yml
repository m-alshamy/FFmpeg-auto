name: FFmpeg HLS Test
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download Sample Video
        run: wget https://www.w3schools.com/html/mov_bbb.mp4 -O input.mp4

      - name: Chunk Video to HLS
        run: ffmpeg -i input.mp4 -profile:v baseline -level 3.0 -start_number 0 -hls_time 4 -hls_list_size 0 -f hls index.m3u8

      - name: Verify Output Files
        run: ls -lh *.m3u8 *.ts
